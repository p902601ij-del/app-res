<div class="card shadow-sm border-0 p-4" style="background-color: #ffffff;">
    <h4 class="mb-4 text-brown">Empleados Registrados</h4>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead class="text-white" style="background-color: #6d2e05;">
                <tr>
                    <th scope="col" class="border-0 ps-3 py-3">Nombre</th>
                    <th scope="col" class="border-0 py-3">Teléfono</th>
                    <th scope="col" class="border-0 py-3">Horario</th>
                    <th scope="col" class="border-0 pe-3 py-3">Salario</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let emp of empleados()">
                    <td class="ps-3 py-3">
                        <div class="fw-bold">{{ emp.Nombre }}</div>
                        <div class="text-muted small">{{ emp.Apellidos }}</div>
                    </td>
                    <td class="py-3">{{ emp.Telefono }}</td>
                    <td class="py-3">
                        <div class="small">{{ emp.Horario }}</div>
                    </td>
                    <td class="pe-3 py-3">
                        <div class="fw-bold">€{{ emp.Salario_mensual }}</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
